services:
  ome:
    image: airensoft/ovenmediaengine:latest
    container_name: ome
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "9999:9999/udp"
      - "3333:3333"
      - "3334:3334"
      - "8080:8080"
      - "8081:8081"
      - "554:554"
      - "10000-10009:10000-10009/udp"
    volumes:
      - ./origin_conf:/opt/ovenmediaengine/bin/origin_conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vmsnet

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vmsnet

  backend:
    build: ./onvif-backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OME_URL=http://ome:8081/v1/vhosts/default/apps/app/streams
      - OME_HOST=ome
      - OME_PORT=3333
      - OME_HOST_IP=192.168.126.200
      - HOST_SUBNET=192.168.126
      - OME_WS_PORT=3333
      - MONGO_URI=mongodb://mongo:27017/
      - RECORDINGS_DIR=/recordings
      - RECORDING_CONFIG_FILE=/app/data/recording_config.json
      - VIDEO_KEY_FILE=/app/data/video.key
      - CHUNK_SECONDS=300
      - TZ=Asia/Kolkata
      - BACKUP_CONFIG=/app/data/backup_config.json
      - BACKUP_HEALTH=/app/data/health_log.json
      # /network_backup inside container = C:\vmsrecording_backup on Windows host
      # Robocopy then pushes C:\vmsrecording_backup → \\10.22.101.30\vmsrecording
      - BACKUP_NETWORK_DIR=/network_backup
    volumes:
      - ./devices_data:/app/data
      # Live recordings: D:\REC on host → /recordings in container
      - D:/REC:/recordings
      # Backup stage: C:\vmsrecording_backup on host → /network_backup in container
      # NOTE: Docker CANNOT mount UNC paths (\\server\share) directly.
      #       Use C:\vmsrecording_backup as staging, then Robocopy pushes it to the laptop.
      - C:/vmsrecording_backup:/network_backup
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - ome
      - mongo
    networks:
      - vmsnet

volumes:
  mongo_data:

networks:
  vmsnet:
    driver: bridge