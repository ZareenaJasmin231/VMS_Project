services:

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    networks:
      - vmsnet

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    mem_limit: 768m
    cpus: "2"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vmsnet

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    ports:
      - "${MQTT_PORT}:${MQTT_PORT}"
      - "${MQTT_WS_PORT}:${MQTT_WS_PORT}"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - vmsnet

  mqtt-consumer:
    build: ./onvif-backend
    container_name: mqtt-consumer
    init: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1"
    command: python -m app.background.mqtt_to_db
    environment:
      - MONGO_URI=mongodb://mongo:${MONGO_PORT}/
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT}
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mongo
      - mosquitto
    networks:
      - vmsnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./onvif-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT}
    container_name: backend
    init: true
    restart: unless-stopped
    mem_limit: 2g
    cpus: "4"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
      - "19999:19999"
    environment:
      - MEDIAMTX_API_URL=http://host.docker.internal:9997
      - HOST_SUBNET=${HOST_SUBNET:-192.168.126}
      - DISCOVERY_TIMEOUT_MS=800
      - MONGO_URI=mongodb://mongo:${MONGO_PORT}/
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT}
      - RECORDINGS_DIR=/recordings
      - RECORDING_CONFIG_FILE=/app/data/recording_config.json
      - VIDEO_KEY_FILE=/app/data/video.key
      - CHUNK_SECONDS=300
      - TZ=Asia/Kolkata
      - BACKUP_CONFIG=/app/data/backup_config.json
      - BACKUP_HEALTH=/app/data/health_log.json
      - BACKUP_NETWORK_DIR=/network_backup
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./devices_data:/app/data
      - E:/REC:/recordings
      - C:/vmsrecording_backup:/network_backup
      - D:/:/mnt/dest_d
      - C:/:/mnt/dest_c
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mongo
      - mosquitto
      - minio
    networks:
      - vmsnet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_logs:
  minio_data:

networks:
  vmsnet:
    driver: bridge