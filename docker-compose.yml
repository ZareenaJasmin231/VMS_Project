services:
  ome:
    image: airensoft/ovenmediaengine:latest
    container_name: ome
    restart: unless-stopped
    ports:
      - "${OME_RTMP_PORT}:${OME_RTMP_PORT}"
      - "${OME_SRT_PORT}:${OME_SRT_PORT}/udp"
      - "${OME_WEBRTC_PORT}:${OME_WEBRTC_PORT}"
      - "${OME_WEBRTC_TLS_PORT}:${OME_WEBRTC_TLS_PORT}"
      - "${OME_LLHLS_PORT}:${OME_LLHLS_PORT}"
      - "${OME_API_PORT}:${OME_API_PORT}"
      - "${OME_RTSP_PORT}:${OME_RTSP_PORT}"
      - "${OME_ICE_RANGE}:${OME_ICE_RANGE}/udp"
    volumes:
      - ./origin_conf:/opt/ovenmediaengine/bin/origin_conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vmsnet

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
    networks:
      - vmsnet

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:${MQTT_PORT}"
      - "${MQTT_WS_PORT}:${MQTT_WS_PORT}"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - vmsnet

  mqtt-consumer:
    build: ./onvif-backend
    container_name: mqtt-consumer
    restart: unless-stopped
    command: python mqtt_to_db.py
    environment:
      - MONGO_URI=mongodb://mongo:${MONGO_PORT}/
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT}
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mongo
      - mosquitto
    networks:
      - vmsnet

  backend:
    build: ./onvif-backend
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT}
    container_name: backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - OME_URL=http://ome:${OME_API_PORT}/v1/vhosts/default/apps/app/streams
      - OME_HOST=ome
      - OME_PORT=${OME_WEBRTC_PORT}
      - OME_HOST_IP=${HOST_IP}
      - HOST_SUBNET=192.168.126
      - OME_WS_PORT=${OME_WEBRTC_PORT}
      - MONGO_URI=mongodb://mongo:${MONGO_PORT}/
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=${MQTT_PORT}
      - RECORDINGS_DIR=/recordings
      - RECORDING_CONFIG_FILE=/app/data/recording_config.json
      - VIDEO_KEY_FILE=/app/data/video.key
      - CHUNK_SECONDS=300
      - TZ=Asia/Kolkata
      - BACKUP_CONFIG=/app/data/backup_config.json
      - BACKUP_HEALTH=/app/data/health_log.json
      - BACKUP_NETWORK_DIR=/network_backup
    volumes:
      - ./devices_data:/app/data
      - D:/REC:/recordings
      - C:/vmsrecording_backup:/network_backup
      - D:/:/mnt/dest_d        # ← add this
      # - E:/:/mnt/dest_e        # ← add this (USB)
      # - F:/:/mnt/dest_f        # ← add this (USB)
      - C:/:/mnt/dest_c        # ← add this
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - ome
      - mongo
      - mosquitto
    networks:
      - vmsnet

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  vmsnet:
    driver: bridge
